          kubernetes-statefulset-update-strategy-type: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_UPDATE_STRATEGY_TYPE }}
          kubernetes-statefulset-update-strategy-partition: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_UPDATE_STRATEGY_PARTITION }}
          kubernetes-statefulset-pvc-enabled: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_PVC_ENABLED }}
          kubernetes-statefulset-pvc-storage-class: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_PVC_STORAGE_CLASS }}
          kubernetes-statefulset-pvc-storage-size: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_PVC_STORAGE_SIZE }}
          kubernetes-statefulset-pvc-access-mode: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_PVC_ACCESS_MODE }}
          kubernetes-statefulset-pvc-volume-name: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_PVC_VOLUME_NAME }}
          kubernetes-statefulset-pvc-mount-path: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_PVC_MOUNT_PATH }}
          kubernetes-statefulset-env-sub-path: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_ENV_SUB_PATH }}
          kubernetes-statefulset-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_ADDITIONAL_LABELS }}
          kubernetes-statefulset-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_STATEFULSET_ADDITIONAL_ANNOTATIONS }}
          # Kubernetes DaemonSet generation
          kubernetes-daemonset-env-sub-path: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_ENV_SUB_PATH }}
          kubernetes-daemonset-update-strategy-type: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_UPDATE_STRATEGY_TYPE }}
          kubernetes-daemonset-max-unavailable: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_MAX_UNAVAILABLE }}
          kubernetes-daemonset-host-network: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_HOST_NETWORK }}
          kubernetes-daemonset-host-pid: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_HOST_PID }}
          kubernetes-daemonset-host-ipc: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_HOST_IPC }}
          kubernetes-daemonset-run-as-non-root: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_RUN_AS_NON_ROOT }}
          kubernetes-daemonset-privileged: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_PRIVILEGED }}
          kubernetes-daemonset-dns-policy: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_DNS_POLICY }}
          kubernetes-daemonset-tolerations: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_TOLERATIONS }}
          kubernetes-daemonset-node-selector: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_NODE_SELECTOR }}
          kubernetes-daemonset-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_ADDITIONAL_LABELS }}
          kubernetes-daemonset-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_DAEMONSET_ADDITIONAL_ANNOTATIONS }}
          # Kubernetes Job generation
          kubernetes-job-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_JOB_NAME_SUFFIX }}
          kubernetes-job-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_JOB_COMBINED_SUB_PATH }}
          kubernetes-job-backoff-limit: ${{ steps.kpm.outputs.KUBERNETES_JOB_BACKOFF_LIMIT }}
          kubernetes-job-completions: ${{ steps.kpm.outputs.KUBERNETES_JOB_COMPLETIONS }}
          kubernetes-job-parallelism: ${{ steps.kpm.outputs.KUBERNETES_JOB_PARALLELISM }}
          kubernetes-job-active-deadline-seconds: ${{ steps.kpm.outputs.KUBERNETES_JOB_ACTIVE_DEADLINE_SECONDS }}
          kubernetes-job-ttl-seconds-after-finished: ${{ steps.kpm.outputs.KUBERNETES_JOB_TTL_SECONDS_AFTER_FINISHED }}
          kubernetes-job-restart-policy: ${{ steps.kpm.outputs.KUBERNETES_JOB_RESTART_POLICY }}
          kubernetes-job-env-sub-path: ${{ steps.kpm.outputs.KUBERNETES_JOB_ENV_SUB_PATH }}
          kubernetes-job-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_JOB_ADDITIONAL_LABELS }}
          kubernetes-job-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_JOB_ADDITIONAL_ANNOTATIONS }}
          kubernetes-job-liveness-probe-enabled: ${{ steps.kpm.outputs.KUBERNETES_JOB_LIVENESS_PROBE_ENABLED }}
          kubernetes-job-readiness-probe-enabled: ${{ steps.kpm.outputs.KUBERNETES_JOB_READINESS_PROBE_ENABLED }}
          kubernetes-job-startup-probe-enabled: ${{ steps.kpm.outputs.KUBERNETES_JOB_STARTUP_PROBE_ENABLED }}
          kubernetes-job-ports-enabled: ${{ steps.kpm.outputs.KUBERNETES_JOB_PORTS_ENABLED }}
          # Kubernetes CronJob generation
          kubernetes-cronjob-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_NAME_SUFFIX }}
          kubernetes-cronjob-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_COMBINED_SUB_PATH }}
          kubernetes-cronjob-concurrency-policy: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_CONCURRENCY_POLICY }}
          kubernetes-cronjob-starting-deadline-seconds: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_STARTING_DEADLINE_SECONDS }}
          kubernetes-cronjob-successful-jobs-history-limit: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_SUCCESSFUL_JOBS_HISTORY_LIMIT }}
          kubernetes-cronjob-failed-jobs-history-limit: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_FAILED_JOBS_HISTORY_LIMIT }}
          kubernetes-cronjob-backoff-limit: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_BACKOFF_LIMIT }}
          kubernetes-cronjob-completions: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_COMPLETIONS }}
          kubernetes-cronjob-parallelism: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_PARALLELISM }}
          kubernetes-cronjob-active-deadline-seconds: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_ACTIVE_DEADLINE_SECONDS }}
          kubernetes-cronjob-restart-policy: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_RESTART_POLICY }}
          kubernetes-cronjob-env-sub-path: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_ENV_SUB_PATH }}
          kubernetes-cronjob-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_ADDITIONAL_LABELS }}
          kubernetes-cronjob-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_ADDITIONAL_ANNOTATIONS }}
          kubernetes-cronjob-liveness-probe-enabled: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_LIVENESS_PROBE_ENABLED }}
          kubernetes-cronjob-readiness-probe-enabled: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_READINESS_PROBE_ENABLED }}
          kubernetes-cronjob-startup-probe-enabled: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_STARTUP_PROBE_ENABLED }}
          kubernetes-cronjob-ports-enabled: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_PORTS_ENABLED }}
          kubernetes-cronjob-ttl-seconds-after-finished: ${{ steps.kpm.outputs.KUBERNETES_CRONJOB_TTL_SECONDS_AFTER_FINISHED }}
          # Kubernetes Service generation
          kubernetes-service-generation-enabled: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_GENERATION_ENABLED }}
          kubernetes-service-type: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_TYPE }}
          kubernetes-service-port: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_PORT }}
          kubernetes-service-target-port: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_TARGET_PORT }}
          kubernetes-service-protocol: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_PROTOCOL }}
          kubernetes-service-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_NAME_SUFFIX }}
          kubernetes-service-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_COMBINED_SUB_PATH }}
          kubernetes-service-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_ADDITIONAL_LABELS }}
          kubernetes-service-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_ADDITIONAL_ANNOTATIONS }}
          kubernetes-service-port-name: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_PORT_NAME }}
          kubernetes-service-node-port: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_NODE_PORT }}
          kubernetes-service-external-name: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_EXTERNAL_NAME }}
          kubernetes-service-external-traffic-policy: ${{ steps.kpm.outputs.KUBERNETES_SERVICE_EXTERNAL_TRAFFIC_POLICY }}
          # Kubernetes PodDisruptionBudget generation
          kubernetes-poddisruptionbudget-generation-enabled: ${{ steps.kpm.outputs.KUBERNETES_PODDISRUPTIONBUDGET_GENERATION_ENABLED }}
          kubernetes-poddisruptionbudget-name-suffix: ${{ steps.kpm.outputs.KUBERNETES_PODDISRUPTIONBUDGET_NAME_SUFFIX }}
          kubernetes-poddisruptionbudget-combined-sub-path: ${{ steps.kpm.outputs.KUBERNETES_PODDISRUPTIONBUDGET_COMBINED_SUB_PATH }}
          kubernetes-poddisruptionbudget-strategy: ${{ steps.kpm.outputs.KUBERNETES_PODDISRUPTIONBUDGET_STRATEGY }}
          kubernetes-poddisruptionbudget-value: ${{ steps.kpm.outputs.KUBERNETES_PODDISRUPTIONBUDGET_VALUE }}
          kubernetes-poddisruptionbudget-additional-labels: ${{ steps.kpm.outputs.KUBERNETES_PODDISRUPTIONBUDGET_ADDITIONAL_LABELS }}
          kubernetes-poddisruptionbudget-additional-annotations: ${{ steps.kpm.outputs.KUBERNETES_PODDISRUPTIONBUDGET_ADDITIONAL_ANNOTATIONS }}

          # Token substitution
          token-delimiter-style: ${{ steps.kpm.outputs.TOKEN_DELIMITER_STYLE }}
          token-name-style: ${{ steps.kpm.outputs.TOKEN_NAME_STYLE }}
          token-name-validation: ${{ steps.kpm.outputs.TOKEN_NAME_VALIDATION }}
          token-builtin-mode: ${{ steps.kpm.outputs.TOKEN_BUILTIN_MODE }}
          config-sub-path: ${{ steps.kpm.outputs.CONFIG_SUB_PATH }}
          config-value-trailing-newline: ${{ steps.kpm.outputs.CONFIG_VALUE_TRAILING_NEWLINE }}
          token-substitution-passes: ${{ steps.kpm.outputs.TOKEN_SUBSTITUTION_PASSES }}

          # Naming, Versions, and Tags calculation
          release-branch: ${{ steps.kpm.outputs.RELEASE_BRANCH }}
          additional-release-branches: ${{ steps.kpm.outputs.ADDITIONAL_RELEASE_BRANCHES }}
          tag-version-max-parts: ${{ steps.kpm.outputs.TAG_VERSION_MAX_PARTS }}
          tag-version-calculation-strategy: ${{ steps.kpm.outputs.TAG_VERSION_CALCULATION_STRATEGY }}
          tag-version-pattern-type: ${{ steps.kpm.outputs.TAG_VERSION_PATTERN_TYPE }}
          tag-version-prefix-parts: ${{ steps.kpm.outputs.TAG_VERSION_PREFIX_PARTS }}
          tag-version-source-sub-path: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_SUB_PATH }}
          tag-version-source-file-name: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_FILE_NAME }}
          tag-version-source-custom-pattern: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_CUSTOM_PATTERN }}
          tag-version-source-two-sub-path: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_SUB_PATH }}
          tag-version-source-two-file-name: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_FILE_NAME }}
          tag-version-source-two-pattern: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_PATTERN }}
          tag-version-source-two-prefix-parts: ${{ steps.kpm.outputs.TAG_VERSION_SOURCE_TWO_PREFIX_PARTS }}
          tag-version-use-source-version-exact: ${{ steps.kpm.outputs.TAG_VERSION_USE_SOURCE_VERSION_EXACT }}

          # Quality check options
          block-slashes: ${{ steps.kpm.outputs.BLOCK_SLASHES }}
          qc-block-slash-containing-branches: ${{ steps.kpm.outputs.QC_BLOCK_SLASH_CONTAINING_BRANCHES }}
          qc-block-double-hyphen-containing-branches: ${{ steps.kpm.outputs.QC_BLOCK_DOUBLE_HYPHEN_CONTAINING_BRANCHES }}
          qc-require-conventional-branches: ${{ steps.kpm.outputs.QC_REQUIRE_CONVENTIONAL_BRANCHES }}
          qc-require-conventional-commits: ${{ steps.kpm.outputs.QC_REQUIRE_CONVENTIONAL_COMMITS }}
          qc-block-conventional-commits: ${{ steps.kpm.outputs.QC_BLOCK_CONVENTIONAL_COMMITS }}
          qc-block-duplicate-commit-messages: ${{ steps.kpm.outputs.QC_BLOCK_DUPLICATE_COMMIT_MESSAGES }}

          # Hook script paths
          hook-pre-build-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_BUILD_SCRIPT_SUB_PATH }}
          hook-pre-tagging-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_TAGGING_TESTS_SCRIPT_SUB_PATH }}
          hook-pre-docker-prepare-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_DOCKER_PREPARE_SCRIPT_SUB_PATH }}
          hook-post-docker-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_DOCKER_TESTS_SCRIPT_SUB_PATH }}
          hook-pre-package-prepare-script-sub-path: ${{ steps.kpm.outputs.HOOK_PRE_PACKAGE_PREPARE_SCRIPT_SUB_PATH }}
          hook-post-package-tests-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_PACKAGE_TESTS_SCRIPT_SUB_PATH }}
          hook-post-versions-and-naming-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_VERSIONS_AND_NAMING_SCRIPT_SUB_PATH }}
          hook-post-build-script-sub-path: ${{ steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH }}

          # GitHub release
          github-release-enabled: ${{ steps.kpm.outputs.GITHUB_RELEASE_ENABLED }}
          github-release-substituted-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_SUBSTITUTED_FILES }}
          github-release-verbatim-files: ${{ steps.kpm.outputs.GITHUB_RELEASE_VERBATIM_FILES }}
          github-release-notes: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES }}
          github-release-notes-file: ${{ steps.kpm.outputs.GITHUB_RELEASE_NOTES_FILE }}
          github-release-add-version-to-filenames: ${{ steps.kpm.outputs.GITHUB_RELEASE_ADD_VERSION_TO_FILENAMES }}

          # === Step Outputs ===
          # Version outputs (from basic-quality-checks, not versions-and-naming)
          version: ${{ steps.quality.outputs.version }}
          version-major: ${{ steps.quality.outputs.version-major }}
          version-minor: ${{ steps.quality.outputs.version-minor }}
          version-patch: ${{ steps.quality.outputs.version-patch }}
          version-2-part: ${{ steps.quality.outputs.version-2-part }}
          version-3-part: ${{ steps.quality.outputs.version-3-part }}
          version-4-part: ${{ steps.quality.outputs.version-4-part }}
          version-dns-safe: ${{ steps.quality.outputs.version-dns-safe }}
          version-2-part-dns-safe: ${{ steps.quality.outputs.version-2-part-dns-safe }}
          version-3-part-dns-safe: ${{ steps.quality.outputs.version-3-part-dns-safe }}
          version-4-part-dns-safe: ${{ steps.quality.outputs.version-4-part-dns-safe }}
          docker-tag: ${{ steps.quality.outputs.docker-tag }}
          docker-image-name: ${{ steps.quality.outputs.docker-image-name }}
          git-tag: ${{ steps.quality.outputs.git-tag }}
          project-name: ${{ steps.quality.outputs.project-name }}
          is-release: ${{ steps.quality.outputs.is-release }}
      - name: Pass check - Post-Build
        if: steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH != '' && success() && steps.check-post-build.outputs.check-run-id != ''
        continue-on-error: true
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: pass
          check-run-id: ${{ steps.check-post-build.outputs.check-run-id }}
      - name: Fail check - Post-Build
        if: steps.kpm.outputs.HOOK_POST_BUILD_SCRIPT_SUB_PATH != '' && failure() && steps.check-post-build.outputs.check-run-id != ''
        uses: ./.github/buildon-github-actions/src/actions/github-check-run
        with:
          action: fail
          check-run-id: ${{ steps.check-post-build.outputs.check-run-id }}
