name: Dog Food & All Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/basic-quality-and-versioning.yaml
    permissions:
      contents: write  # Push the tag and change-source note, create the GitHub release.
      packages: write  # Push images to GHCR and pull private layers and images from it.
      checks: write    # Report each build stage as a check run on the commit.
      id-token: write  # OIDC logins to AWS ECR, Azure ACR and GCP GAR, when configured.
