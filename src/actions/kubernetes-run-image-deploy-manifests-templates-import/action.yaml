name: 'Kubernetes Run Image Deploy Manifests Templates Import'
description: 'Resolves spec.templates into the deploy-manifests set - the stock templates import pinned at the deploy-manifests block dirs by its wrapper script'

inputs:
  # Build output
  output-sub-path:
    description: 'Build output directory (relative)'
    required: false
    default: 'kaptain-out'
  # Schema validation provider
  schema-validation-command:
    description: 'Full path to the schema validation plugin (from validate-tooling)'
    required: true
  # Token substitution
  token-delimiter-style:
    description: 'Token delimiter syntax for variables (shell, mustache, helm, erb, github-actions, blade, stringtemplate, ognl, t4, swift)'
    required: false
    default: 'shell'
  token-name-style:
    description: 'Case style for token names (UPPER_SNAKE, lower_snake, lower-kebab, UPPER-KEBAB, camelCase, PascalCase, lower.dot, UPPER.DOT)'
    required: false
    default: 'PascalCase'
  token-name-validation:
    description: 'How to validate user token names (MATCH = must match token-name-style, ALL = accept any valid name)'
    required: false
    default: 'MATCH'
  config-sub-path:
    description: 'Directory containing user-defined token files (relative)'
    required: false
    default: 'src/config'
  config-value-trailing-newline:
    description: 'How to handle trailing newlines in config values (strip-for-single-line, preserve-all, always-strip-one-newline)'
    required: false
    default: 'strip-for-single-line'
  token-substitution-passes:
    description: 'Number of times to run the token substitution pass (for nested token references)'
    required: false
    default: '1'
  # Docker registry logins
  docker-registry-logins:
    description: 'YAML config for Docker registry logins (registry URL as key)'
    required: false
    default: ''
  # Docker target config
  docker-target-registry:
    description: 'Target container registry domain (defaults to ghcr.io on GH Actions)'
    required: false
    default: ''
  docker-target-namespace:
    description: 'Path segment between registry and image name (defaults to lower cased org name or user ID on GH Actions)'
    required: false
    default: ''
  # Docker push targets
  docker-push-targets:
    description: 'JSON array of additional push targets [{registry, namespace?}]'
    required: false
    default: ''
  # Container runtime
  image-build-command:
    description: 'Container runtime command (podman or docker)'
    required: true
  # Run environment settings
  # Empty values use the defaults in src/scripts/defaults/environments.bash.
  env-deploy-source-base-path:
    description: 'Source dir for the deploy-image manifests (relative)'
    required: false
    default: ''
  generate-ideal-environment-deploy-manifests:
    description: 'Generate the ideal deploy manifests (true) or consume supplied ones (false)'
    required: false
    default: ''
  image-deploy-manifests-apply-mode:
    description: 'How a run-platform applies this environment deploy-manifests set - seed-and-compare or enforce-state-normally, environment only'
    required: false
    default: ''
  env-deploy-mode:
    description: 'deployment | job (generate-mode only)'
    required: false
    default: ''
  job-post-deploy-sleep-after-success:
    description: 'Job mode: how long the deploy pod stays up after a successful deploy, e.g. 10m'
    required: false
    default: ''
  job-post-deploy-sleep-after-failure:
    description: 'Job mode: how long the deploy pod stays up after a failed deploy, e.g. 24h'
    required: false
    default: ''
  image-pull-secrets:
    description: 'ENABLED | DISABLED - whether the generated deploy workloads reference the registry pull secret (generate-mode only)'
    required: false
    default: ''
  auto-generate-image-pull-secrets:
    description: 'true | false - generate a dockerconfigjson Secret for each imagePullSecrets name the workload contents reference'
    required: false
    default: ''
  image-auto-update-provider:
    description: 'keel | keelson | none'
    required: false
    default: ''
  image-auto-update-policy:
    description: 'patch | minor | major | all | force (force is keel-only)'
    required: false
    default: ''
  image-auto-update-trigger:
    description: 'poll | default'
    required: false
    default: ''
  image-auto-update-poll-schedule:
    description: 'Single-unit duration, e.g. 1m (rendered per provider)'
    required: false
    default: ''
  image-auto-update-field-manager-strategy:
    description: 'mimic | patch | claim (keelson only, ignored otherwise)'
    required: false
    default: ''
  cluster-scoped-delegation:
    description: 'self | parent (env-only; RP is the root and always self)'
    required: false
    default: ''
  cluster-scoped-kinds-file:
    description: 'File NAME (versioned) of the cluster-scoped Kind list in fixed src/data/cluster-scoped-kinds/'
    required: false
    default: ''
  env-deploy-base-image-registry:
    description: 'Registry of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-include-namespace:
    description: 'true (default) includes the namespace segment in the composed base image; false ignores the namespace value and condenses the segment out'
    required: false
    default: ''
  env-deploy-base-image-namespace:
    description: 'Namespace segment of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-family:
    description: 'Family of the composed environment deploy base image'
    required: false
    default: ''
  env-deploy-base-image-version:
    description: 'Version of the composed environment deploy base image'
    required: false
    default: ''
  allow-local-manifests-override:
    description: 'When true, local src/kubernetes files override colliding child-contributed paths (warn per replacement)'
    required: false
    default: ''
  fail-on-unreferenced-config-or-secrets:
    description: 'When true (default), config/secret value files no token references fail the build; false warns'
    required: false
    default: ''
  secrets-sub-path:
    description: 'Directory containing encrypted secret value files (relative)'
    required: false
    default: ''

  # Action-specific inputs
  project-name:
    description: 'Run name (run-* / run-platform-*)'
    required: true
  templates-layout:
    description: 'Layout for imported template manifests: flat (default) or hierarchy'
    required: false
    default: 'flat'
  is-release:
    description: 'When true, template version ranges resolve to release-only bundle versions (excludes -PRERELEASE and platform-suffixed tags)'
    required: false
    default: 'false'

outputs:
  templates-list-file:
    description: 'Path to markdown bullet list of spec.templates entries'
    value: ${{ steps.templates-import.outputs.TEMPLATES_LIST_FILE }}

runs:
  using: 'composite'
  steps:
    - name: Import deploy-manifests templates
      id: templates-import
      shell: bash
      env:
        BUILD_MODE: build_server
        BUILD_PLATFORM: github-actions
        BUILD_PLATFORM_LOG_PROVIDER: github-actions
        PROJECT_NAME: ${{ inputs.project-name }}
        OUTPUT_SUB_PATH: ${{ inputs.output-sub-path }}
        SCHEMA_VALIDATION_COMMAND: ${{ inputs.schema-validation-command }}
        TOKEN_DELIMITER_STYLE: ${{ inputs.token-delimiter-style }}
        TOKEN_NAME_STYLE: ${{ inputs.token-name-style }}
        TEMPLATES_LAYOUT: ${{ inputs.templates-layout }}
        DOCKER_TARGET_REGISTRY: ${{ inputs.docker-target-registry }}
        DOCKER_TARGET_NAMESPACE: ${{ inputs.docker-target-namespace }}
        IMAGE_BUILD_COMMAND: ${{ inputs.image-build-command }}
        IS_RELEASE: ${{ inputs.is-release }}
        ENV_ENVIRONMENT_DEPLOY_SOURCE_BASE_PATH: ${{ inputs.env-deploy-source-base-path }}
      run: "${{ github.action_path }}/../../scripts/main/kubernetes-run-image-deploy-manifests-templates-import"
