# Run clean-up policy
# Kept as JSON: the deploy scripts consume this structure from the cleanup
# policy ConfigMap, and the nested matcher lists do not flatten into inputs.
# Empty means preview only, remove nothing (applied in kubernetes-run-aggregate).
clean-up:
  description: 'The whole spec.main.<kind>.cleanUp block as JSON, from load-final-kaptainpm-yaml'
  required: false
  type: string
  default: ''
